 fill="#8dffcc" font-size="17" letter-spacing="2">RECOVERY CHECKLIST</text><text x="83" y="493" fill="#dedee3" font-size="21">1. Read Pod events  →  2. Correct the image reference  →  3. Confirm rollout  →  4. Check /api/health</text><text x="83" y="529" fill="#9999a2" font-size="16">A deliberate lab failure used to practice diagnosis and recovery—not a production incident.</text></g></svg>